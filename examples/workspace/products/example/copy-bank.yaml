# The ONLY free text the submission agent can enter into a form. Every string here is published on
# third-party directories once a batch is approved, so write it the way you want it to appear.
#
# - Replace every TODO. batch:approve refuses a copy bank that still contains one.
# - Give several variants per key where fields vary in length: the agent picks the longest variant
#   that fits each field's limit (or the shortest, when a site rejects long text).
# - Delete keys you don't want used. A required field with no matching key stops the item and asks
#   you, rather than guessing.
# - Any edit after approval invalidates that approval until you approve the batch again.
product: example
strings:
  name:
    - Example
  url:
    - https://example.com
  email:
    - TODO public contact email for listings
  company_name:
    - TODO company or studio name
  # Open-source products only: the public source repo, for directories that list only open-source
  # projects. They're proposed only with this set and open_source_license confirmed in product.yaml.
  # repo_url:
  #   - https://github.com/you/example
  # MCP servers only: the server's public repo and, for a hosted server, its remote endpoint. MCP
  # directories need one or the other, and are proposed only with mcp_server: true in product.yaml.
  # mcp_repo_url:
  #   - https://github.com/you/example-mcp
  # mcp_url:
  #   - https://example.com/mcp
  # Company facts some company-profile directories require (a country and state select, a founded
  # date). Only entered where a site requires them; directories that do aren't proposed without them.
  # country:
  #   - United States
  # region:
  #   - New York   # state, province or region
  # founded_date:
  #   - 2024-03-01   # YYYY-MM-DD
  # Personal details, for maker profiles that insist on one. These are only filled into fields the
  # site marks as required; optional ones stay empty. Delete the keys to never share them.
  first_name:
    - TODO your first name
  last_name:
    - TODO your last name
  handle:
    - TODO a username, 5-20 letters, digits or underscores
  tagline:
    - TODO short pitch, under 40 characters
    - TODO one-line pitch, under 60 characters
  short_description:
    - TODO one or two sentences, under 160 characters, on what it does and who it is for
  description:
    - TODO a paragraph of 400-700 characters on what it does, who it is for and why it is different
  # Only for fields that demand a minimum word count (some sites require 200+ words).
  long_description:
    - TODO about 250 words
  target_audience:
    - TODO who it is for, e.g. "B2B SaaS founders"
  use_case:
    - TODO one sentence on the main job it does
  features:
    - TODO the main features, in one or two sentences
  # Three short, distinct selling points, 60 characters or less each, for sites that ask for
  # "three things that set it apart" or key-feature rows.
  feature_1:
    - TODO the first thing that sets it apart
  feature_2:
    - TODO the second
  feature_3:
    - TODO the third
  pricing_text:
    - TODO e.g. "Free plan; paid plans from $9/month"
  launch_comment:
    - TODO the maker's first comment on a launch, why you built it, in 2-4 sentences
# Values the agent may pick from a site's own lists. It picks the closest options the site offers.
choices:
  categories: [TODO]
  tags: [TODO]
  pricing_models: [TODO]   # e.g. Free, Freemium, Paid, One-time
  alternatives_to: []
  platforms: [Web]
  tech_stack: []   # e.g. Next.js, PostgreSQL, Stripe; some directories won't take a listing without one
# Asset key -> file under this product's directory. Directories ask for a square logo (512x512 PNG
# works almost everywhere) and 1440x900 screenshots. Keys: logo, screenshot_1, screenshot_2, ...
assets: {}
#  logo: assets/logo-512.png
#  screenshot_1: assets/screenshot-1-1440x900.png
