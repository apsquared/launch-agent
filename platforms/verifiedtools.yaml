recipe: >-
  - 2026-10-22 (public form only, not a tested submission): MANUAL ONLY. /terms section 7
  explicitly prohibits bots, scrapers and automated posting tools. Keep this directory out of
  automated batches. The following describes the form for the owner; it does not authorize an
  agent to fill it. The owner can record a completed listing with mark afterwards.


  - 2026-10-22: Public /submit requires Name (2-60 characters), Slug (2-64; the owner supplies
  listing_slug), Website URL, Tagline (max 100), Short Description (10-160), Description (max 1000),
  category, pricing, contact email, logo and one to three screenshots. Logo: SVG/PNG preferred,
  max 512x512, compressed if over 200KB. Screenshots: 16:9, max width 1600px, compressed if over
  1MB; the first becomes the featured image. Email receives a claim link and must match the
  account used to manage the listing. Optional video, social links and affiliate-program flag
  should be left empty unless supplied and approved by the owner.


  - 2026-10-22: The form defaults to paid Starter. The owner must explicitly choose Free ($0),
  not Starter, Pro or Premium. Free review is advertised at seven to nine weeks, with a nofollow
  link unless the badge is embedded. A badge does not imply priority review. Publication and the
  actual link should be verified after the owner submits; the initial form is not proof of either.
