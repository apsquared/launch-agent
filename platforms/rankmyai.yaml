recipe: >-
  - 2026-10-22 (public form only, not a tested submission): /tool-addition needs no login. Required:
  Your name (max 100; use the approved public first_name or another owner-provided name), email,
  tool name, website URL/subdomain, prominent use cases (max 300), short description (max 400),
  and the legal company name. Only use company_name if the owner confirms it is the legal name;
  otherwise stop and ask rather than inventing one.


  - 2026-10-22: Optional ProductHunt profile, company website, LinkedIn, founding year, employee
  count, headquarters/address, pricing (max 15), pricing URL and API availability (max 10) may be
  left blank. Never infer company facts or contact details. The separate newsletter form at the
  bottom is not part of the tool submission. Submit with "Send" and record submitted_pending_review
  only on the form's actual success confirmation. The page's static success text alone is not
  proof the form was sent. No fee or mandatory badge is stated; tool pages offer an optional logo.


  - 2026-10-22: A public tool page's "Visit website" link uses rel="noopener nofollow" and UTM
  referral parameters. Keep it outside dofollow-only batches unless verify establishes otherwise.
