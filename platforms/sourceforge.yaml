recipe: >-
  - 2026-10-09 (pages seen, not yet submitted): Manual: the user does this. /auth/ is a username and
  password login with "Create Account"; no Google sign-in was offered. /create/ links "Create Your
  Project Now" and "Import from GitHub" (/p/import_project/github/); the importer brings in the repo
  and its releases, and the project then appears in SourceForge's Open Source Directory, where it can
  be categorized by topic, platform and license and given screenshots.
