recipe: >-
  - 2026-09-26: /submit step 1 needs no login: URL, name, tagline, description (min 500 characters, use
  long_description), logo (max 500 KB), up to 4 screenshots, categories (max 3), pricing
  (Free/Freemium/Paid) and platforms. Step 2: the free listing needs a ToolDirs badge (light, dark or
  transparent embed) live on the product's site before "Verify and Submit" works; paid plans ($9.99,
  $14.99) skip the badge. Capture the badge and record waiting_badge.
  - 2026-09-26: On the retry, "Verify and Submit" redirects to /login: use "Continue with Google" and wait
  about 5 seconds for the redirect to finish (don't goto mid-OAuth). The form draft persists, but
  re-select the pricing model after the reload, then Next, then "Verify and Submit" (no checkboxes).
  /dashboard/profile then shows the listing as "Pending Review / Free".
