  comment max 200: skip the comment if launch_comment doesn't fit). Submit creates a draft and goes
  to /submit/plan/?slug=<slug>.


  - 2026-09-26: Free flow on /submit/plan/?slug=<slug>: click Free Launch, Verify badge (works once
  the badge is live on the homepage), Start voting: 3 rounds, vote buttons disabled ~5s per round
  (wait, then click again). Then Submit launch -> week picker (the earliest weeks can be full) ->
  Next -> /submit/thanks/?plan=free. Reviewed, then published in the chosen week.
