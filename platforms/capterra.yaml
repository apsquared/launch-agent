  - 2026-10-05: Official profile guidelines prohibit calls to action and personal contact details
  in descriptions, and prohibit line breaks, symbols, special characters and HTML. Use matching
  approved plain-paragraph copy; ask for revisions if necessary. At least one screenshot or video
  is strongly encouraged. Do not start sponsored campaigns or review outreach during submission.
