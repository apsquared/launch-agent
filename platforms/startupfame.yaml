slug: startupfame
name: Startup Fame
category: product-launch
home_url: https://startupfa.me/
submit_url: https://startupfa.me/login
domains:
  - startupfa.me
auth: google
free_route: yes
badge: required
mode: auto
audience: Startup directory with founder audience.
tier: 2
queue_note: Free listings are reviewed and published within about 7 days.
eligibility:
  - Free route is verified with a homepage badge.
recipe: >-
  - 2026-09-26: /login -> Google -> /dashboard -> "Add startup" modal, enter URL; AI prefills the
  form (~15s) at /dashboard/<slug>. Edit tab: fill tagline/description; Media tab uploads logo +
  image; Save. /submit is 404. Badge: /dashboard/<slug>/badges -> click "Get embed code" ->
  capture_badge.


  - 2026-09-26: Save silently fails with long tagline/description variants; short ones
  (prefer=short, ~30 / ~250 chars) saved. Check /s/<slug> after Save. The dashboard may already hold
  a prefilled draft from an earlier attempt (<slug>-1).


  - 2026-09-26: The free "Verified" listing needs the badge live on the homepage, then a checkbox
  and "Verify now" on /dashboard/<slug>/promote. That page is flagged as a payment page
  (Highlight/Spotlight prices), so the agent can't tick or click there: the owner ticks the checkbox
  and clicks Verify now by hand.


  - 2026-09-29: Links tab: the Twitter/X field has a fixed https://x.com/ prefix, so enter the
  handle only (no URL) or the public page links to https://x.com/https://x.com/<handle>. Save on
  that tab requires Contact email.


  - 2026-10-15: The AI prefill (or a draft from the shared launch account) can leave another
  product's handle or links in the Links tab's social fields. Check every one: fill it from the copy
  bank when there's a matching key, otherwise clear it. The edit form is one form across the
  General, Media and Links tabs: Save stays disabled or silently fails until Links > Contact email
  is filled, so fill that first, then the General fields, then Save once ("Success! Your startup has
  been updated."). Upload the logo after that and Save again.
observed_at: 2026-10-15
sources:
  - https://startupfa.me/pricing
