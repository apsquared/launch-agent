recipe: >-
  - 2026-09-26: Google sign-in works. /submit (name, url, category, logo, Free plan) creates a draft at
  /profile/tools/<id>/edit; fill the Details, Pricing and Features tabs and Save. The free plan stays
  "Not published" until Findly's badge is on the product's site and verified. The embed code is only on
  the clipboard: on the edit page's Listing tab click "Copy embed code", then capture_badge, then record
  waiting_badge. On the retry, open the same Listing tab and click "Verify badge now".
  - 2026-09-28: "Continue to review (Free)" refused a github.com repo URL: "github.com already exists.
  Each domain can only be submitted once." No draft was created.
