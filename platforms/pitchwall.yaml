recipe: >-
  - 2026-09-26: /submit > Select Plan (free) > Google sign-in > /product/submit?plan=free. Paste the URL
  and click Add: AI prefills the form in about 10 seconds; overwrite name, summary and details from the
  copy bank (the prefilled tags can stay). Summary needs 100-160 characters, so use a short_description
  of that length. Next creates a draft at /product/<slug>/edit: upload the logo and images, then "Submit
  for Review". The status page /product/<slug>/status shows "Under Review" (30+ day wait). No badge
  needed. Skip the Pro and Premium upsells.
