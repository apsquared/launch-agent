recipe: >-
  - 2026-10-09 (form seen, not yet submitted): /submit is a Formbricks form inline on the page, no
  sign-in. Pick "selfh.st/apps (Directory)", then "Suggest an App" (not "Update or Correction"). Fields:
  Project Name (name), Link (url, or repo_url when the project has no website), "Does the project
  leverage AI to assist with development?" (Yes, No, I'm not sure; all required) and Description
  (description). Answer the AI question only from the owner's instructions for this directory; with
  none, stop before Submit and leave the item for the user.
