  - 2026-10-22: Choose "Free Launch" ($0, 20 weekly slots), not Premium, Highlight or sponsorships.
  The advertised ordinary free queue is about 60 weeks. With badges enabled, the official Club
  flow offers earlier scheduling: capture the actual badge snippet, deploy it on the same public
  HTTPS URL being submitted, then use the site's verification step. Badge verification does not
  approve the product; keep the badge live or the listing may be hidden. If the site requires the
  badge before proceeding, record waiting_badge through the normal workflow.


  - 2026-10-22: The pricing page reserves free-plan dofollow for the top three. The Club badge
  changes timing, not that requirement. Do not report a badge-backed free launch as guaranteed
