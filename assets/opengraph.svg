<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">launch-agent: submit your product to startup and SaaS directories</title>
  <desc id="desc">Write your listing once, approve a batch, and let a guarded agent handle directory submissions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c2d"/>
      <stop offset="1" stop-color="#08111d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79e8c1"/>
      <stop offset="1" stop-color="#a9f0d8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1080" cy="-95" r="350" fill="#183246" opacity=".35"/>
  <circle cx="-110" cy="650" r="300" fill="#143044" opacity=".25"/>
  <path d="M48 548H1152" stroke="#294051" stroke-width="1"/>

  <g transform="translate(52 52)">
    <rect width="48" height="48" rx="13" fill="url(#accent)"/>
    <path d="M12 33V15h5v13h18v5H12Z" fill="#092033"/>
    <path d="m22 23 6-6m0 0h-5m5 0v5" fill="none" stroke="#092033" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="34" fill="#f1f7f8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="-1">launch-agent</text>
  </g>

  <text x="52" y="185" fill="#f4f8f9" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2">Submit your product</text>
  <text x="52" y="255" fill="#f4f8f9" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2">to startup &amp; SaaS</text>
  <text x="52" y="325" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2">directories.</text>

  <text x="54" y="400" fill="#b6c7d0" font-family="Arial, Helvetica, sans-serif" font-size="25">Write your listing once. Approve a batch.</text>
  <text x="54" y="437" fill="#b6c7d0" font-family="Arial, Helvetica, sans-serif" font-size="25">Let the agent handle the forms.</text>

  <g transform="translate(785 133)">
    <rect width="365" height="350" rx="26" fill="#142536" stroke="#355267" stroke-width="1.5"/>
    <text x="29" y="44" fill="#8daebc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">HOW IT WORKS</text>
    <path d="M53 95V269" stroke="#3f5b68" stroke-width="2" stroke-dasharray="5 7"/>

    <circle cx="53" cy="104" r="22" fill="#254c4d"/>
    <text x="43" y="111" fill="#a9f0d8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">1</text>
    <text x="92" y="101" fill="#f1f7f8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Write your copy</text>
    <text x="92" y="126" fill="#a9bec9" font-family="Arial, Helvetica, sans-serif" font-size="16">One listing, ready to reuse</text>

    <circle cx="53" cy="190" r="22" fill="#254c4d"/>
    <text x="43" y="197" fill="#a9f0d8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">2</text>
    <text x="92" y="187" fill="#f1f7f8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Approve a batch</text>
    <text x="92" y="212" fill="#a9bec9" font-family="Arial, Helvetica, sans-serif" font-size="16">See the sites and exact text</text>

    <circle cx="53" cy="276" r="22" fill="#254c4d"/>
    <text x="43" y="283" fill="#a9f0d8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">3</text>
    <text x="92" y="273" fill="#f1f7f8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Submit and track</text>
    <text x="92" y="298" fill="#a9bec9" font-family="Arial, Helvetica, sans-serif" font-size="16">Free routes, clear results</text>
  </g>

  <text x="53" y="588" fill="#87a3b0" font-family="Arial, Helvetica, sans-serif" font-size="19">Open source · Human-approved submissions · Free routes only</text>
</svg>
