name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Typecheck, guard tests, skill and subagent drift, privacy, templates and every platform playbook.
      - run: npm test
      - name: Plugin manifests are valid JSON with the expected shape
        run: |
          node -e '
            const p = require("./.claude-plugin/plugin.json"), m = require("./.claude-plugin/marketplace.json");
            if (p.name !== "launch-agent" || !p.skills) throw new Error("plugin.json");
            if (!m.plugins.some((x) => x.name === p.name && x.source === "./")) throw new Error("marketplace.json");
          '
